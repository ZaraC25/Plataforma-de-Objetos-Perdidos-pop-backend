version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: pop_db
    environment:
      POSTGRES_DB: pop
      POSTGRES_USER: pop_user
      POSTGRES_PASSWORD: pop_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pop_user -d pop"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pop_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@universidad.edu
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
